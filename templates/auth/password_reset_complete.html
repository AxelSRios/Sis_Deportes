{% extends 'auth/base_auth.html' %}
{% load static %}

{% block title %}Contraseña actualizada | A.F.O. Oruro{% endblock %}

{% block body %}
<main class="relative min-h-screen overflow-hidden bg-primary">
  <div class="auth-grid pointer-events-none absolute inset-0 opacity-50"></div>
  <div class="auth-crest" aria-hidden="true">
    <img src="{% static 'img/afo-crest-transparent@2x.webp' %}" alt=""/>
  </div>
  <div class="pointer-events-none absolute -left-24 top-0 h-72 w-72 rounded-full bg-secondary-fixed/20 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-20 bottom-0 h-80 w-80 rounded-full bg-primary-container/70 blur-3xl"></div>

  <div class="relative z-10 mx-auto flex min-h-screen w-full max-w-lg items-center justify-center px-5 py-12">
    <div class="w-full rounded-3xl bg-surface-container-lowest p-8 text-center shadow-2xl sm:p-10">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-surface-container">
        <span class="material-symbols-outlined text-3xl text-primary">verified_user</span>
      </div>
      <h1 class="auth-title mt-5 text-2xl text-on-surface">Contraseña actualizada</h1>
      <p class="mt-2 text-sm leading-6 text-on-surface-variant">
        Su contraseña se cambió correctamente. Ya puede ingresar con sus nuevas
        credenciales.
      </p>
      <a class="auth-btn mt-6" href="{% url 'login' %}">Iniciar sesión</a>
    </div>
  </div>
</main>
{% endblock %}
