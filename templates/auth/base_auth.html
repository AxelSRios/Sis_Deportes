{% load static afo_extras %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Acceso institucional | A.F.O. Oruro{% endblock %}</title>
  <meta name="description" content="Acceso institucional a la plataforma de gestión deportiva de la Asociación de Fútbol Oruro."/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="theme-color" content="#002b6d"/>
  <link rel="icon" type="image/png" href="{% static 'img/afo-crest.png' %}"/>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Nunito:wght@400..1000&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind-config.js' %}"></script>

  <style>
    html { scroll-behavior: smooth; }

    /* Titular de marca: misma familia y sombras cian de la portada pública */
    .auth-display {
      font-family: 'Nunito', 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: .005em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .10),
                   0 5px 0 rgba(0, 103, 127, .30),
                   0 14px 30px rgba(119, 211, 242, .38);
    }
    .auth-title {
      font-family: 'Nunito', 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.1;
    }

    /* Retícula sutil del hero */
    .auth-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .10) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    /* Escudo de la AFO como marca de agua */
    .auth-crest {
      position: absolute;
      left: 52%;
      top: 50%;
      width: min(46rem, 105vw);
      z-index: 0;
      opacity: .13;
      pointer-events: none;
      user-select: none;
      transform: translate(-50%, -50%);
      animation: auth-crest-float 16s ease-in-out infinite;
      will-change: transform;
    }
    .auth-crest img { display: block; width: 100%; height: auto; }
    @keyframes auth-crest-float {
      0%, 100% { transform: translate(-50%, -50%) rotate(-3deg) scale(1); }
      50%      { transform: translate(calc(-50% + 10px), calc(-50% - 18px)) rotate(3deg) scale(1.03); }
    }

    /* Campos del formulario */
    .auth-label {
      display: block;
      font-size: .875rem;
      font-weight: 700;
      color: #0b1c30;
    }
    .auth-input {
      width: 100%;
      height: 2.85rem;
      border-radius: .85rem;
      background: #eff4ff;
      padding: 0 1rem 0 2.75rem;
      font-size: .95rem;
      color: #0b1c30;
      border: 1px solid transparent;
      outline: none;
      transition: background .2s, border-color .2s, box-shadow .2s;
    }
    .auth-input::placeholder { color: rgba(67, 70, 81, .55); }
    .auth-input:focus {
      background: #ffffff;
      border-color: #3b5ca5;
      box-shadow: 0 0 0 3px rgba(59, 92, 165, .15);
    }

    .auth-form input[type="email"],
    .auth-form input[type="password"],
    .auth-form input[type="text"] {
      width: 100%;
      height: 2.85rem;
      border-radius: .85rem;
      background: #eff4ff;
      padding: 0 1rem;
      font-size: .95rem;
      color: #0b1c30;
      border: 1px solid transparent;
      outline: none;
      transition: background .2s, border-color .2s, box-shadow .2s;
    }
    .auth-form input:focus {
      background: #ffffff;
      border-color: #3b5ca5;
      box-shadow: 0 0 0 3px rgba(59, 92, 165, .15);
    }
    .auth-form ul { margin-top: .35rem; padding-left: 1rem; font-size: .75rem; color: #434651; }
    .auth-form .errorlist {
      list-style: none;
      margin: .4rem 0 0;
      padding: 0;
      font-size: .78rem;
      font-weight: 600;
      color: #ba1a1a;
    }
    .auth-form .errorlist li { margin: 0; }
    .auth-form .helptext { display: block; margin-top: .35rem; font-size: .75rem; color: #434651; }

    .auth-btn {
      display: inline-flex;
      width: 100%;
      height: 2.85rem;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      border-radius: .85rem;
      background: #002b6d;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: .01em;
      box-shadow: 0 10px 24px rgba(0, 43, 109, .22);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    .auth-btn:hover {
      background: #1f438b;
      box-shadow: 0 14px 30px rgba(0, 43, 109, .26);
      transform: translateY(-1px);
    }
    .auth-btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    .auth-link {
      color: #002b6d;
      font-weight: 600;
    }
    .auth-link:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .auth-crest { animation: none !important; }
      .auth-btn { transition: none; }
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased" data-page="login" data-shell="false">
  {% block body %}{% endblock %}
  <script src="{% static_v 'js/shell.js' %}"></script>
</body>
</html>
