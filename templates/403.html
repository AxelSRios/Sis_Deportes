{% load static afo_extras %}
<!DOCTYPE html>
<html lang="es">
<!-- Acceso restringido por rol institucional. -->
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Acceso restringido | AFO Oruro</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{% static_v 'css/styles.css' %}"/>
<link rel="stylesheet" href="{% static_v 'css/tailwind.css' %}"/>
</head>
<body class="bg-surface text-on-surface antialiased">
<main class="flex min-h-screen items-center justify-center bg-primary px-5 py-12">
  <div class="w-full max-w-md rounded-2xl bg-surface-container-lowest p-8 text-center shadow-2xl">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-error/10 text-error">
      <span class="material-symbols-outlined text-3xl">lock</span>
    </div>
    <h1 class="mt-4 font-headline-sm text-xl font-bold text-on-surface">Acceso restringido</h1>
    <p class="mt-2 text-sm leading-6 text-on-surface-variant">
      {{ mensaje|default:"Su rol institucional no tiene permisos para esta sección." }}
    </p>
    {% if rol_label %}
      <p class="mt-3 inline-flex items-center gap-1.5 rounded-lg bg-surface-container px-3 py-1.5 text-[11px] font-semibold text-on-surface-variant">
        <span class="material-symbols-outlined text-[14px]">badge</span>
        {{ rol_label }}
      </p>
    {% endif %}
    <div class="mt-6 flex flex-col gap-2">
      <a href="{% url 'panel' %}" class="inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-primary px-4 text-sm font-semibold text-on-primary transition hover:bg-primary-container">
        <span class="material-symbols-outlined text-[18px]">dashboard</span>
        Volver al panel
      </a>
      <a href="{% url 'index' %}" class="inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-surface-container px-4 text-sm font-semibold text-on-surface-variant transition hover:bg-surface-container">
        Ir a la portada pública
      </a>
    </div>
  </div>
</main>
</body>
</html>
