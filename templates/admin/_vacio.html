<div class="afo-empty-state">
  <span class="afo-empty-state-icon" aria-hidden="true">
    <span class="material-symbols-outlined">{{ icono|default:"inbox" }}</span>
  </span>
  <h3>{{ titulo|default:"Sin registros" }}</h3>
  <p>{{ detalle|default:"No hay información que coincida con los filtros aplicados." }}</p>
  {% if accion_url %}
    <a href="{{ accion_url }}" class="mt-4 inline-flex h-10 items-center gap-2 rounded-lg bg-primary px-4 text-sm font-semibold text-on-primary shadow-sm transition hover:bg-primary-container">
      <span class="material-symbols-outlined text-[18px]">add</span>
      {{ accion_texto|default:"Crear registro" }}
    </a>
  {% endif %}
</div>
